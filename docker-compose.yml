version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: dpi_postgres
    environment:
      POSTGRES_USER: dpi
      POSTGRES_PASSWORD: dpi
      POSTGRES_DB: dpi
    ports:
      - "5433:5432"
    volumes:
      - dpi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpi -d dpi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dpi_pgdata:
