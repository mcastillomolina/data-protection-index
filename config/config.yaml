# Main configuration file for Data Protection Index

project:
  name: "Data Protection Index"
  version: "0.2.0"
  phase: 2

llm:
  provider: "deepseek"  # Options: "openai", "anthropic", "groq", "deepseek", "mistral"
  # deepseek models: deepseek-chat (DeepSeek-V3), deepseek-reasoner (DeepSeek-R1)
  # groq models (free tier): llama-3.3-70b-versatile, llama-3.1-8b-instant, mixtral-8x7b-32768, gemma2-9b-it
  # openai models: gpt-4o, gpt-4o-mini, gpt-4-turbo
  # anthropic models: claude-3-5-sonnet-20241022, claude-3-haiku-20240307
  model: "deepseek-chat"
  # model: "deepseek-v4-flash"     # BROKEN as of 2026-08: thinking mode cannot be
  #   disabled (thinking_budget_tokens=0 / enable_thinking=False both ignored by the
  #   API). For any non-trivial prompt (identify_documents, criterion scoring with
  #   real evidence) the model burns the full max_tokens budget on reasoning_content
  #   and returns finish_reason="length" with empty content. Confirmed on both the
  #   discovery and scoring prompts — do not re-enable until DeepSeek fixes this.
  # model: "deepseek-v4-pro"       # more capable, higher cost
  # model: "llama-3.1-8b-instant"  # groq
  temperature: 0.3  # Lower for more consistent outputs
  max_tokens: 4000
  timeout: 90  # was 30 — too tight for longer completions (e.g. identify_documents),
               # caused spurious APITimeoutError under normal DeepSeek latency
  max_retries: 3

search:
  provider: "serpapi"
  max_results_per_query: 10
  timeout: 30  # was 15, but never actually reached SerpAPI (see search_client.py fix
               # — the request timeout was vestigial, defaulting to the underlying
               # library's ~16.7h default). Now that it's wired up for real: normal
               # calls run median 2s, p90 21s, observed max 28s — 30s covers that
               # tail with margin while still cutting off multi-minute hangs.
  rate_limit_delay: 1.0  # seconds between requests

pipeline:
  max_documents_per_country: 20
  top_urls_per_document: 5
  min_relevance_score: 6.0
  enable_deduplication: true
  enable_caching: true
  cache_dir: "data/cache"
  cache_ttl_seconds: 2592000  # 30 days

output:
  directory: "data/outputs"
  save_intermediate: true
  intermediate_dir: "intermediate"
  format: "json"
  pretty_print: true
  include_metadata: true

retrieval:
  timeout: 30
  max_retries: 3
  retry_delay: 2.0  # seconds between retry attempts
  min_text_length: 200  # minimum chars to consider extraction successful
  user_agent: "DataProtectionIndex/1.0"

extraction:
  llm_provider: "deepseek"               # or "anthropic" for larger docs
  llm_model: "deepseek-chat"             # deepseek-v4-flash BROKEN — see llm.model note above
  # llm_provider: "groq"                 # or "anthropic" for larger docs
  # llm_model: "llama-3.3-70b-versatile" # sections are small; Groq is sufficient
  schema_file: "config/extraction_schema.yaml"
  min_section_chars: 100                  # skip sections shorter than this
  max_section_chars: 4000                 # split oversized paragraphs (Tier 3)

scoring:
  cosine_similarity_threshold: 0.35   # Gate 2 minimum similarity to pass
  max_sections_per_criterion: 20      # top-N sections returned per criterion query
  embedding_model: "nomic-embed-text"
  embedding_provider: "ollama"
  embedding_dims: 768
  ollama_base_url: "http://localhost:11434"
  ollama_timeout: 180  # per-batch (100 sections) HTTP timeout; local model, no cost
                       # for waiting. Was hardcoded at 60s — too tight under concurrent
                       # runs sharing one Ollama container, caused ReadTimeout mid-run
                       # after Phase 1-3 had already completed and persisted fine.
  legal_weight: 0.40                  # weight for legal dimension in final score
  enforcement_weight: 0.60            # weight for enforcement dimension in final score
  missing_strategy: "exclude"         # "exclude" or "penalise_as_1"
  confidence_weighting: true          # weight criterion scores by confidence level
  min_criteria_for_ranking: 12        # min scored criteria to enter the exported ranking;
                                      # countries below this are computed + persisted with
                                      # partial_coverage=true but excluded from the ranking
  benchmark_models: []                # model strings for --benchmark-models flag

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
  file: "logs/discovery.log"
  rotation: "10 MB"
  retention: "1 week"
