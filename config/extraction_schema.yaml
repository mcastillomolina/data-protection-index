      - lawful_basis
      - notes

  court_decision:
    expected_fields:
      - key_provisions
      - constitutional_privacy_right
    optional_fields:
      - constitutional_articles
      - enforcement_body
      - notes

  border_surveillance_law:
    expected_fields:
      - key_provisions
      - border_biometrics_deployed
    optional_fields:
      - biometric_legal_basis
      - enforcement_body
      - statutory_penalties
      - notes

  workplace_privacy_law:
    expected_fields:
      - key_provisions
      - enforcement_body
    optional_fields:
      - statutory_penalties
      - actual_sanctions
      - notes

  default:
    expected_fields:
      - key_provisions
    optional_fields:
      - data_subject_rights
      - enforcement_body
      - statutory_penalties
      - actual_sanctions
      - lawful_basis
      - notes
