  surveillance_law:
    expected_fields:
      - key_provisions
      - interception_legal_standard
    optional_fields:
      - cctv_regulatory_status
      - enforcement_body
      - statutory_penalties
      - notes

  biometrics_id_law:
    expected_fields:
      - key_provisions
      - biometric_legal_basis
    optional_fields:
      - border_biometrics_deployed
      - enforcement_body
      - statutory_penalties
      - notes

  international_treaty:
    expected_fields:
